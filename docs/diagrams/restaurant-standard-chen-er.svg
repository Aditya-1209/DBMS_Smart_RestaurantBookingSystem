ality">(1,N)</text><text x="2535" y="1345" class="cardinality">(1,1)</text><text x="1870" y="445" class="cardinality">(0,N)</text><text x="2535" y="445" class="cardinality">(1,1)</text><text x="2820" y="560" class="cardinality">(0,N)</text><text x="2820" y="1290" class="cardinality">(1,1)</text><text x="1870" y="1434" class="cardinality">(0,1)</text><text x="2535" y="2245" class="cardinality">(1,1)</text><text x="70" y="2660" class="note">RECTANGLE = entity     DIAMOND = relationship     OVAL = attribute     UNDERLINED = primary key     DASHED OVAL = derived attribute</text><text x="70" y="2695" class="note">(min,max) labels describe participation per instance: (1,1) exactly one; (0,1) optional one; (0,N) optional many; (1,N) one or more.</text><text x="70" y="2730" class="note">Foreign keys are represented by relationships. ORDER ITEM has its own primary key and resolves the ORDER–MENU ITEM many-to-many relationship.</text><text x="70" y="2765" class="note">ORDER contains one or more lines at checkout; SQL temporarily permits an empty parent. Derived values are stored/generated or trigger-maintained.</text></svg>