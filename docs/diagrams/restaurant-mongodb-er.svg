<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="1760" viewBox="0 0 1530 1760" role="img" aria-labelledby="title desc"><title id="title">Restaurant management — MongoDB document schema</title><desc id="desc">3 collections · Dashed links are application-validated SQL references, not database foreign keys REF logical SQL reference   UQ unique index   PK MongoDB _id. Grey entities repeat PostgreSQL keys for context. Cardinality is the application relationship; MongoDB cannot enforce a cross-database foreign key. Nested rows are embedded fields. Review writes require order ownership and completed payment. A customization document may be pending while the SQL outbox synchronizes.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253d32;font-size:20px}.entity{fill:white;font-size:24px;font-weight:700}.key{font-size:15px;font-weight:700;fill:#7b5d28}.field{font-size:18px}.dtype{font-size:15px;fill:#66776d}.relation{font-size:19px;paint-order:stroke;stroke:#fbfcfa;stroke-width:8px;stroke-linejoin:round}.subtitle{fill:#66776d;font-size:21px}.note{fill:#53685c;font-size:19px}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="60" y="65" style="font-size:34px;font-weight:700">Restaurant management — MongoDB document schema</text><text x="60" y="105" class="subtitle">3 collections · Dashed links are application-validated SQL references, not database foreign keys</text><path d="M500,230 L650,230 L650,260 L880,260" fill="none" stroke="#52685e" stroke-width="2" stroke-dasharray="8 6"/><path d="M508,221 L508,239" fill="none" stroke="#52685e" stroke-width="2"/><path d="M527,221 L527,239" fill="none" stroke="#52685e" stroke-width="2"/><path d="M877,269 L861,260" fill="none" stroke="#52685e" stroke-width="2"/><path d="M877,260 L861,260" fill="none" stroke="#52685e" stroke-width="2"/><path d="M877,251 L861,260" fill="none" stroke="#52685e" stroke-width="2"/><circle cx="852" cy="260" r="6" fill="white" stroke="#52685e" stroke-width="2"/><path d="M5